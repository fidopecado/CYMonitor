name: Firmware

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build esp32-3248s035
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build firmware
        run: pio run --environment esp32-3248s035

      - name: Report binary size
        run: |
          ls -lh .pio/build/esp32-3248s035/firmware.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: cymonitor-firmware
          path: |
            .pio/build/esp32-3248s035/firmware.bin
            .pio/build/esp32-3248s035/bootloader.bin
            .pio/build/esp32-3248s035/partitions.bin
          if-no-files-found: error
