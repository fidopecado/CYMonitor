; PlatformIO Project Configuration File for ESP32-3248S035 (3.5" CYD)
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting

[env:esp32-3248s035]
; Pinned. Arduino-ESP32 core 3.x removes ledcSetup()/ledcAttachPin() and the
; global FS alias used by WebServer.h, so an unpinned build breaks on a fresh
; install. 7.1.3 + framework 4.20017.0 is the combination this firmware is
; built and tested against; bump both together after porting to the ledcAttach()
; API.
platform = espressif32@7.1.3
platform_packages =
    platformio/framework-arduinoespressif32@~4.20017.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/tzapu/WiFiManager.git

build_flags = 
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=65000000
    -D SPI_READ_FREQUENCY=20000000
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000