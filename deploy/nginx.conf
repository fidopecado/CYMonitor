server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Optional same-origin proxy for LibreHardwareMonitor.
    #
    # Serving the app and the sensor endpoint from one origin removes two
    # browser restrictions at once: no CORS preflight, and no mixed content
    # when the page itself is served over HTTPS.
    #
    # docker-compose.yml maps host.docker.internal, so requests resolve to the
    # machine running LibreHardwareMonitor. Point the web app at
    # http://localhost:8080/lhm/data.json to use it.
    #
    # The name is resolved when Nginx loads, not per request: this keeps the
    # upstream immutable and avoids runtime DNS entirely. If a deployment has
    # no host.docker.internal (plain `docker run` on Linux without
    # --add-host), remove this block or the container will refuse to start.
    location /lhm/ {
        proxy_pass http://host.docker.internal:8085/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 4s;
        proxy_read_timeout 10s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location = / {
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    location = /app.html {
        expires -1;
    }

    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
